<!DOCTYPE html><html class="h-full bg-slate-900 flex items-center justify-center" lang="en"><head>
<meta charset="utf-8">
<meta content="width=390, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport">
<title>ER Guard by Medicare Plus - Splash Screen</title>
<!-- Google Fonts for Clean Modern Aesthetic -->
<link href="https://fonts.googleapis.com" rel="preconnect">
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&amp;display=swap" rel="stylesheet">
<!-- Tailwind CSS v3 with Plugins -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Configuration -->
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', '-apple-system', 'sans-serif'],
          },
          colors: {
            brand: {
              red: '#D81920',
              crimson: '#B80D14',
              orange: '#FF5722',
              amber: '#FF7A00',
              teal: '#20B2AA',
              cyan: '#00B4D8',
              charcoal: '#1A1A1E',
              subtle: '#64748B'
            }
          },
          animation: {
            'pulse-subtle': 'pulseSlow 3.2s ease-in-out infinite',
            'flow-wave': 'waveFloat 7s ease-in-out infinite alternate',
            'dash-ecg': 'dash 2.4s ease-in-out infinite',
            'soft-fade': 'fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards',
          },
          keyframes: {
            pulseSlow: {
              '0%, 100%': { opacity: '0.85', transform: 'scale(1)' },
              '50%': { opacity: '1', transform: 'scale(1.02)' },
            },
            waveFloat: {
              '0%': { transform: 'translateY(0px) rotate(0deg)' },
              '100%': { transform: 'translateY(-12px) rotate(-1deg)' },
            },
            dash: {
              '0%': { strokeDashoffset: '600' },
              '50%': { strokeDashoffset: '0' },
              '100%': { strokeDashoffset: '-600' },
            },
            fadeIn: {
              '0%': { opacity: '0', transform: 'translateY(8px)' },
              '100%': { opacity: '1', transform: 'translateY(0)' },
            }
          }
        }
      }
    }
  </script>
<!-- Custom Styles: SVG & Wave Glass Layers -->
<style data-purpose="custom-animations">
    .ecg-line {
      stroke-dasharray: 400;
      animation: dash 3s ease-in-out infinite;
    }
    @keyframes dash {
      0% {
        stroke-dashoffset: 400;
        opacity: 0.2;
      }
      35% {
        opacity: 1;
      }
      70%, 100% {
        stroke-dashoffset: 0;
        opacity: 0.2;
      }
    }
    .mesh-gradient-bg {
      background: radial-gradient(circle at 10% 15%, rgba(255, 94, 58, 0.08) 0%, transparent 45%),
                  radial-gradient(circle at 90% 85%, rgba(216, 25, 32, 0.06) 0%, transparent 50%),
                  #FCFCFD;
    }
  </style>
</head>
<body class="bg-slate-950 font-sans antialiased text-slate-900 m-0 p-0 flex items-center justify-center min-h-screen select-none">
<!-- BEGIN: MobileDeviceFrame -->
<main class="w-[390px] h-[844px] mesh-gradient-bg relative overflow-hidden flex flex-col justify-between shadow-[0_25px_60px_rgba(0,0,0,0.4)] rounded-[48px] border-[6px] border-slate-800/80">
<!-- Ambient Subtle Top Lighting -->
<div aria-hidden="true" class="absolute -top-32 -left-20 w-80 h-80 bg-gradient-to-br from-amber-400/20 to-brand-red/10 rounded-full blur-3xl pointer-events-none"></div>
<div aria-hidden="true" class="absolute top-1/4 -right-24 w-72 h-72 bg-gradient-to-b from-brand-red/15 to-orange-400/10 rounded-full blur-3xl pointer-events-none"></div>
<!-- BEGIN: TopStatusBar -->
<header class="w-full pt-3 px-8 z-30 flex items-center justify-between" data-purpose="mobile-status-bar">
<!-- Time -->
<span class="text-[15px] font-semibold tracking-tight text-slate-900 pl-0.5">9:41</span>
<!-- Dynamic Island / Speaker Notch Illusion -->
<div class="w-28 h-[22px] bg-slate-900/10 backdrop-blur-md rounded-full -mt-0.5 flex items-center justify-center">
<div class="w-2.5 h-2.5 rounded-full bg-slate-900/20 mr-2"></div>
<div class="w-2.5 h-2.5 rounded-full bg-slate-900/20"></div>
</div>
<!-- Native Status Bar Icons -->
<div class="flex items-center gap-1.5 text-slate-900">
<!-- Cellular Signal -->
<svg class="w-4 h-4 fill-current" viewBox="0 0 24 24">
<rect height="6" rx="0.8" width="3" x="2" y="16"></rect>
<rect height="10" rx="0.8" width="3" x="7" y="12"></rect>
<rect height="14" rx="0.8" width="3" x="12" y="8"></rect>
<rect height="18" rx="0.8" width="3" x="17" y="4"></rect>
</svg>
<!-- WiFi -->
<svg class="w-4 h-4 fill-current ml-0.5" viewBox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21L24 8.98C20.93 5.9 16.69 4 12 4ZM12 8.5C14.76 8.5 17.26 9.62 19.11 11.47L12 18.58L4.89 11.47C6.74 9.62 9.24 8.5 12 8.5Z"></path>
</svg>
<!-- Battery -->
<div class="relative w-5 h-2.5 border border-slate-900 rounded-sm ml-0.5 p-0.5 flex items-center">
<div class="h-full w-3/4 bg-slate-900 rounded-2xs"></div>
<div class="absolute -right-1 top-0.5 bottom-0.5 w-0.5 bg-slate-900 rounded-r-xs"></div>
</div>
</div>
</header>
<!-- END: TopStatusBar -->
<!-- BEGIN: BrandCenterpiece -->
<section class="flex-1 flex flex-col items-center justify-center px-8 z-20 -mt-8" data-purpose="splash-centerpiece">
<!-- Medicare Plus Origami Bird Wing Emblem -->
<div class="relative mb-6 transform hover:scale-105 transition-transform duration-500" data-purpose="origami-bird-logo"><img src="https://lh3.googleusercontent.com/aida-public/AB6AXuAPCzVatXHlf109PGOHy3lLKk45eoFirztro9VqZuYi_w4ZV19DhdeQ3CG92TW1GQcSsvK4OdAxlicMyYrYdBLpi_Wd_izF9EVeftw_AZ0-IGK49mYxyNGcU9LHbzaPxJlRfmH-A73WmaVoztGTTX32kDzbZ1zhzR_9euV4s6cniiLoGUNjSwWtVCKZT4n9mqo4pCp80CSo7tZQK0qeTv1uW6R7idnFaZDVJeG4zg8eJbJAVIpNFb1tUFVwpOPtZjB7AA" alt="Medicare Plus Emblem" class="w-20 h-20 object-contain drop-shadow-md relative z-10"><div class="absolute inset-0 bg-red-500/10 rounded-full blur-xl -z-10 animate-pulse-subtle"></div></div>
<!-- Brand Typography "medicare plus" sub-badge -->
<div class="flex items-center gap-1 mb-5" data-purpose="parent-brand-lockup">
<span class="text-[15px] font-medium tracking-tight text-slate-700">medicare</span>
<span class="text-[15px] font-black tracking-tight text-slate-900">plus</span>
<span class="inline-block w-1.5 h-1.5 rounded-full bg-brand-red ml-0.5"></span>
</div>
<!-- Main Distinctive ER GUARD Logotype with Inset Emergency Cross -->
<div class="relative flex flex-col items-center justify-center text-center" data-purpose="primary-er-guard-brand">
<div class="flex items-baseline justify-center tracking-tight select-none">
<!-- 'E' -->
<span class="text-4xl font-extrabold text-slate-950 tracking-[-0.03em]">E</span>
<!-- 'R' with Emergency Cross Emblem Embedded -->
<div class="relative inline-flex items-center justify-center">
<span class="text-4xl font-extrabold text-slate-950 tracking-[-0.03em]">R</span>
<!-- Red Emergency Plus Sign inside R curve -->
<span class="absolute -top-1.5 -right-2 flex items-center justify-center w-4 h-4 bg-brand-red rounded-full shadow-sm ring-2 ring-white">
<svg class="w-2.5 h-2.5 text-white fill-current" viewBox="0 0 24 24">
<path d="M19 11h-6V5h-2v6H5v2h6v6h2v-6h6z"></path>
</svg>
</span>
</div>
<!-- 'GUARD' -->
<span class="text-4xl font-black text-slate-950 tracking-tight ml-2.5">GUARD</span>
</div>
<!-- Flowing ECG / Pulse Line (Signature feature from ER Guard Card) -->
<div class="w-64 h-8 mt-2 relative flex items-center justify-center">
<svg class="w-full h-full stroke-brand-red" fill="none" viewBox="0 0 240 40" xmlns="http://www.w3.org/2000/svg">
<path class="ecg-line" d="M0 20 L75 20 L84 7 L93 34 L102 12 L111 27 L117 20 L240 20" stroke-linecap="round" stroke-linejoin="round" stroke-opacity="0.9" stroke-width="2.5"></path>
</svg>
<!-- Tiny Heartbeat Glowing Orb -->
<div class="absolute w-2 h-2 rounded-full bg-brand-red shadow-[0_0_8px_#D81920] animate-ping" style="left: 45%;"></div>
</div>
<!-- Tagline & Corporate Label -->
<p class="mt-4 text-[13.5px] font-semibold text-slate-500 uppercase tracking-[0.22em] text-center">
          Emergency Care Within Reach
        </p>
</div>
</section>
<!-- END: BrandCenterpiece -->
<!-- BEGIN: FlowingCardArtworkAccent -->
<!-- Liquid Organic Curves Inspired directly by the ER Guard physical cards in Reference Image -->
<div class="relative w-full h-64 overflow-hidden z-10 pointer-events-none" data-purpose="flowing-card-cutout-wave">
<!-- Backing Layer: Translucent Golden Orange Wave -->
<svg class="absolute bottom-0 left-0 w-full h-56" fill="none" viewBox="0 0 390 220" xmlns="http://www.w3.org/2000/svg">
<path d="M-10 160 C80 180, 160 80, 240 100 C310 118, 350 70, 410 80 L410 230 L-10 230 Z" fill="url(#cardAccentGradBack)" opacity="0.45"></path>
<defs>
<linearGradient gradientUnits="userSpaceOnUse" id="cardAccentGradBack" x1="0" x2="390" y1="80" y2="220">
<stop stop-color="#FFA826"></stop>
<stop offset="1" stop-color="#E82A1B"></stop>
</linearGradient>
</defs>
</svg>
<!-- Foreground Layer: Vibrant Rich Crimson-to-Citrus Gradient Wave matching Physical Card -->
<svg class="absolute bottom-0 left-0 w-full h-48 drop-shadow-[0_-8px_20px_rgba(216,25,32,0.18)]" fill="none" viewBox="0 0 390 190" xmlns="http://www.w3.org/2000/svg">
<path d="M-10 120 C70 140, 120 40, 200 65 C280 90, 320 20, 405 35 L405 200 L-10 200 Z" fill="url(#cardAccentGradFront)"></path>
<!-- Inner Glow Highlight Line -->
<path d="M-10 120 C70 140, 120 40, 200 65 C280 90, 320 20, 405 35" fill="none" stroke="rgba(255, 255, 255, 0.45)" stroke-width="1.5"></path>
<defs>
<linearGradient gradientUnits="userSpaceOnUse" id="cardAccentGradFront" x1="20" x2="370" y1="20" y2="180">
<stop stop-color="#EA1E28"></stop>
<stop offset="0.55" stop-color="#F25119"></stop>
<stop offset="1" stop-color="#FA8C16"></stop>
</linearGradient>
</defs>
</svg>
<!-- Bottom Compliance & Security Micro-Details (Inside Wave Contrast) -->
<div class="absolute bottom-9 left-0 right-0 px-8 flex items-center justify-between z-20 text-white/90">
<!-- Brand Affiliation Stamp -->
<div class="flex items-center gap-2">
<div class="w-5 h-5 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center shadow-inner">
<svg class="w-3 h-3 text-white fill-current" viewBox="0 0 24 24">
<path d="M12 2L4 5v6.09c0 5.05 3.41 9.76 8 10.91 4.59-1.15 8-5.86 8-10.91V5l-8-3zm1 14h-2v-2h2v2zm0-4h-2V7h2v5z"></path>
</svg>
</div>
<span class="text-[11px] font-medium tracking-wide text-white/90">Medicare Plus Inc.</span>
</div>
<!-- Subtle App Launch Status Indicator -->
<div class="flex items-center gap-1.5" data-purpose="loading-indicator">
<span class="w-1.5 h-1.5 rounded-full bg-white animate-pulse"></span>
<span class="w-1.5 h-1.5 rounded-full bg-white/60"></span>
<span class="w-1.5 h-1.5 rounded-full bg-white/30"></span>
<span class="text-[11px] font-semibold text-white/80 tracking-widest uppercase ml-1">v1.0</span>
</div>
</div>
</div>
<!-- END: FlowingCardArtworkAccent -->
<!-- BEGIN: iOSHomeIndicator -->
<footer class="w-full pb-2.5 flex justify-center z-30 absolute bottom-1" data-purpose="ios-home-indicator">
<div class="w-36 h-1 bg-white/60 rounded-full backdrop-blur-md"></div>
</footer>
<!-- END: iOSHomeIndicator -->
</main>
<!-- END: MobileDeviceFrame -->


</body></html>
