<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>ER Guard Onboarding - Medicare Plus</title>
<!-- Google Fonts: Plus Jakarta Sans & Caveat for the script 'Plus' -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Space+Grotesk:wght@500;600&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS v3 CDN with forms & container queries -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              red: '#D31320',
              deepRed: '#800010',
              crimson: '#9e0c1b',
              orange: '#FF5B22',
              coral: '#FF7A45',
              dark: '#111827',
              muted: '#4B5563'
            }
          },
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'system-ui', 'sans-serif'],
            script: ['"Caveat"', 'cursive'],
            cardno: ['"Space Grotesk"', 'monospace']
          },
          boxShadow: {
            'card-front': '0 24px 44px -10px rgba(230, 42, 16, 0.28), 0 10px 18px -6px rgba(0, 0, 0, 0.08)',
            'card-back': '0 20px 36px -12px rgba(128, 0, 16, 0.35), 0 8px 16px -4px rgba(0, 0, 0, 0.1)',
            'cta': '0 12px 24px -4px rgba(211, 19, 32, 0.38)'
          }
        }
      }
    }
  </script>
<!-- Custom Styles for Precise Card Geometries & Ambient Visual Effects -->
<style data-purpose="card-geometry">
    /* Subtle background ambient mesh */
    .ambient-glow {
      background: radial-gradient(circle at 50% 25%, rgba(255, 91, 34, 0.09) 0%, rgba(211, 19, 32, 0.04) 45%, transparent 70%);
    }

    /* Wave styling using layered SVGs and pseudo elements */
    .card-sheen {
      position: relative;
      overflow: hidden;
    }
    .card-sheen::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 100%;
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.18) 0%, rgba(255, 255, 255, 0) 50%);
      pointer-events: none;
    }

    /* iOS home bar and notch bounds */
    .ios-shell {
      max-width: 414px;
      min-height: 100vh;
      min-height: 100dvh;
    }
  </style>
</head>
<body class="bg-[#F4F4F6] text-slate-900 font-sans antialiased flex justify-center items-center min-h-screen p-0 sm:p-4">
<!-- BEGIN: MobileContainer -->
<main class="ios-shell w-full bg-[#FCFBFF] shadow-2xl relative flex flex-col justify-between overflow-hidden sm:rounded-[44px] sm:border-[8px] sm:border-slate-900/90" data-purpose="mobile-screen-wrapper">
<!-- Ambient Warm Aura Background -->
<div class="absolute inset-0 ambient-glow pointer-events-none z-0"></div>
<!-- Top Glow Accent -->
<div class="absolute -top-16 -right-16 w-52 h-52 bg-gradient-to-br from-amber-200/40 via-red-200/20 to-transparent rounded-full blur-3xl pointer-events-none"></div>
<!-- BEGIN: TopBarSection -->
<header class="relative z-20 w-full pt-3 px-7 pb-2" data-purpose="status-and-nav-header">
<!-- iOS Status Bar -->
<div class="flex justify-between items-center text-[14px] font-semibold tracking-tight text-slate-800 mb-4 select-none">
<span class="pl-1 text-[15px] font-bold">9:41</span>
<div class="flex items-center space-x-2 text-slate-800">
<!-- Signal Icon -->
<svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<path d="M12 3c-4.97 0-9 4.03-9 9 0 2.12.74 4.07 1.97 5.61L12 22l7.03-4.39C20.26 16.07 21 14.12 21 12c0-4.97-4.03-9-9-9zm0 2c3.87 0 7 3.13 7 7 0 1.54-.5 2.97-1.35 4.14L12 19.53l-5.65-3.39C5.5 14.97 5 13.54 5 12c0-3.87 3.13-7 7-7z" fill="none"></path>
<path d="M2 17h3v4H2zm5-4h3v8H7zm5-4h3v12h-3zm5-5h3v17h-3z"></path>
</svg>
<!-- Wifi Icon -->
<svg class="w-4 h-4 fill-current" viewbox="0 0 24 24">
<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.2c3.8 0 7.27 1.45 9.9 3.86L12 18.25 2.1 11.06C4.73 8.65 8.2 7.2 12 7.2z"></path>
</svg>
<!-- Battery Icon -->
<div class="w-6 h-3 border border-slate-700 rounded-sm p-[1.5px] flex items-center relative">
<div class="w-3.5 h-full bg-slate-800 rounded-2xs"></div>
<div class="absolute -right-1 w-0.5 h-1.5 bg-slate-700 rounded-r-xs"></div>
</div>
</div>
</div>
<!-- Navigation & Brand Sub-header -->
<div class="flex items-center justify-between pt-1">
<!-- Medicare Plus Wordmark Badge -->
<div class="flex items-center space-x-2" data-purpose="brand-badge">
<img alt="Medicare Plus Logo" class="w-7 h-7 object-contain drop-shadow-sm" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBCL0irmlXChdRcCyuoWPCI96wsYsJfAYnMWVYc-qDg63ALTHrWdQqbBgbAnHJJ7SdMXYsRF_Fz0LrxykFiP6a46RV3b8c5wqKTk_Qb_rFF1HEGV7altJRm4bfW8EBGKWLpxUXYloWFan0uEW_dqTKdFk_0C9kWen3HV7tIcw2A2kK7vxbZ4d6Dumr0HpT5oip-wWYnpNJH9CaoS8Do0maQIlnNCLZIZG-87ILQmKZZV-vQCj7O22a5XXH0JuERF6b9xw"/>
<div class="flex flex-col leading-none">
<span class="text-[13px] font-extrabold tracking-wider uppercase text-slate-800">medicare</span>
<span class="text-[11px] font-bold text-brand-red tracking-widest uppercase">plus inc.</span>
</div>
</div>
<!-- Quick Skip Action -->
<button aria-label="Skip to main screen" class="text-xs font-semibold text-slate-400 hover:text-slate-700 transition-colors uppercase tracking-wider py-1 px-2.5 rounded-full hover:bg-slate-100" type="button">
          Skip
        </button>
</div>
</header>
<!-- END: TopBarSection -->
<!-- BEGIN: CardShowcaseCenterpiece -->
<section aria-label="ER Guard Card Showcase" class="relative z-10 flex-1 flex flex-col justify-center items-center px-5 py-2" data-purpose="digital-card-showcase">
<div class="w-full max-w-[348px] relative h-[255px] flex items-center justify-center">
<!-- CARD 2: ER GUARD PLUS (Backdrop Card / Angled Floating Stack) -->
<div class="absolute top-1 -right-1.5 w-[306px] h-[190px] rounded-[22px] shadow-card-back card-sheen transform translate-x-3 -translate-y-3 rotate-4 overflow-hidden border border-white/40 select-none transition-transform hover:rotate-3 duration-300" data-purpose="card-er-guard-plus">
<!-- Crimson / Wine Red Multi-layered Background -->
<div class="absolute inset-0 bg-gradient-to-br from-[#8E000C] via-[#AB0818] to-[#60000A]"></div>
<!-- Sculpted darker fluid wave forms -->
<svg class="absolute inset-0 w-full h-full" fill="none" preserveaspectratio="none" viewbox="0 0 306 190">
<path d="M0,0 L160,0 C175,0 182,12 188,24 C198,44 212,50 234,48 C256,46 270,62 274,84 C280,116 288,138 306,146 L306,190 L0,190 Z" fill="#6A000A" fill-opacity="0.45"></path>
<path d="M120,190 C150,140 180,110 230,120 C270,128 290,165 306,190 Z" fill="#4B0007" fill-opacity="0.5"></path>
</svg>
<!-- Top-Right White Rounded Notch for Bird Logo -->
<div class="absolute top-0 right-0 w-[114px] h-[52px] bg-white rounded-bl-[24px] shadow-sm flex items-center justify-center pl-2 pr-1.5 pt-0.5">
<div class="flex items-center space-x-1.5">
<img alt="Medicare Plus" class="w-6 h-6 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBPoM0XaWFglI9M8erqVsHExoZs1DY33cwOCOr8TtoRq94OKnQwTMrMVT_3s5_hRKrwmgPFr0mgdLnlIwpmSZk6Yl2eWBSY788JFVUb2zjWzzsi0-REWxNqR_nMhkIA911yy1aBOevF-Y4LhbRVgO6UqDaJOEMsRWrotUNl5iCg51jkfcsEHH-sQz3ySqeE1gePeB62mSjrRkZ21V23D6cTPqMYU7cMEBoxYeQ6Cdn4M-_aiz1XjyLA3NUEAfPKP4PgEA"/>
<div class="leading-none text-left">
<span class="block text-[10px] font-black tracking-tight text-slate-900 leading-none">medicare</span>
<span class="block text-[8px] font-bold text-slate-800 leading-tight">plus</span>
</div>
</div>
</div>
<!-- Card Content: ER GUARD PLUS Wordmark & Script -->
<div class="absolute top-4 left-4 z-10">
<div class="flex items-baseline space-x-0.5">
<span class="text-white text-[22px] font-extrabold tracking-tight font-sans drop-shadow-sm flex items-center">
                ER<span class="text-brand-orange text-lg leading-none font-black mx-[1px]">+</span>GUARD
              </span>
</div>
<!-- Elegant Warm Honey Gold Script 'Plus' directly underneath/flowing -->
<span class="font-script text-[#FFCA58] text-[33px] font-bold -mt-2.5 ml-8 block leading-none drop-shadow-sm tracking-wide">
              Plus
            </span>
</div>
<!-- Bottom Crisp Card Number -->
<div class="absolute bottom-3 left-4 text-white/95 font-cardno text-[13px] tracking-[0.18em] font-medium drop-shadow-xs">
            123 456 7891 0112
          </div>
</div>
<!-- CARD 1: ER GUARD (Foreground Focus Card) -->
<div class="absolute bottom-0 -left-1 w-[318px] h-[198px] rounded-[24px] shadow-card-front card-sheen transform -rotate-2 overflow-hidden border-[1.5px] border-white/80 select-none z-10 transition-transform hover:-rotate-1 duration-300" data-purpose="card-er-guard-standard">
<!-- Vibrant Warm Orange-Red Gradient Base -->
<div class="absolute inset-0 bg-gradient-to-br from-[#FF4C1E] via-[#FF6024] to-[#E32314]"></div>
<!-- Sculpted Organic Fluid Cutout Waves -->
<svg class="absolute inset-0 w-full h-full" fill="none" preserveaspectratio="none" viewbox="0 0 318 198">
<!-- Gentle curved orange shading -->
<path d="M0,0 L180,0 C194,0 200,16 206,28 C216,48 230,54 250,52 C272,50 286,66 290,88 C296,118 304,138 318,144 L318,198 L0,198 Z" fill="#E83015" fill-opacity="0.65"></path>
<path d="M50,198 C100,140 140,105 210,120 C260,130 285,170 318,188 L318,198 Z" fill="#FF783A" fill-opacity="0.35"></path>
</svg>
<!-- Top-Right Medicare Plus Cutout Pill/Box -->
<div class="absolute top-0 right-0 w-[118px] h-[54px] bg-white rounded-bl-[26px] shadow-sm flex items-center justify-center pl-2.5 pr-2 pt-0.5">
<div class="flex items-center space-x-1.5">
<img alt="Medicare Plus Logo" class="w-6 h-6 object-contain" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB3MXAc2YycxnqyzGuOn0vbCePXsf6T16gidEbmLI33pKJTvaX0k9eIl4Dae-tdOgCxj2kyNMyUMFyUWkAA7to-4VnMqK3AzSRJfLmxm5fNE4ZZGvAwlu-u-WkfiLnLeU12er-yto75LnJIKDqafmKZpaMOgM9lYOjDhzK3dsSfsqpMihPDeKtXx2zvKDg-ZFXzG8QUSPeOMDgTcIb2Qvnk46_I5LsN8IwTV2_WbVEoHHbClswOuRvW6SYFRV0Xuf9e6Q"/>
<div class="leading-none text-left">
<span class="block text-[11px] font-black tracking-tight text-slate-900 leading-none">medicare</span>
<span class="block text-[8.5px] font-bold text-slate-800 leading-tight">plus</span>
</div>
</div>
</div>
<!-- Wordmark: ER GUARD + Pulse Rhythm Line -->
<div class="absolute top-4 left-4 z-10">
<div class="flex items-center tracking-tight text-white">
<span class="text-[23px] font-black tracking-tight font-sans drop-shadow-sm flex items-center">
                ER<span class="text-white text-base font-black mx-[1.5px] leading-none">+</span>GUARD
              </span>
</div>
<!-- Crisp Heartbeat ECG Rhythm Line directly beneath -->
<div class="w-[124px] mt-1.5 opacity-95">
<svg class="w-full h-auto stroke-white" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" viewbox="0 0 130 20">
<path d="M0 10 L28 10 L33 4 L38 16 L43 1 L48 18 L53 10 L60 10 L64 5 L68 15 L72 10 L130 10"></path>
</svg>
</div>
</div>
<!-- Bottom Left Embossed Card Number -->
<div class="absolute bottom-3.5 left-4 text-white font-cardno text-[14px] tracking-[0.19em] font-semibold drop-shadow-sm">
            123 456 7891 0112
          </div>
</div>
</div>
</section>
<!-- END: CardShowcaseCenterpiece -->
<!-- BEGIN: BottomContentAndActions -->
<footer class="relative z-20 px-6 pt-3 pb-8 flex flex-col items-center text-center" data-purpose="onboarding-footer">
<!-- Copy Section -->
<div class="mb-6 max-w-[320px]">
<!-- Headline -->
<h1 class="text-[25px] sm:text-[26px] font-extrabold text-brand-dark tracking-tight leading-[1.2] mb-2.5">
          Your emergency card, <br/>always with you.
        </h1>
<!-- Subtitle Body Copy -->
<p class="text-brand-muted text-[15px] leading-relaxed font-medium px-1">
          Activate and access your ER Guard coverage directly from your phone.
        </p>
</div>
<!-- Pagination Indicator Dots -->
<div aria-label="Onboarding step 1 of 3" class="flex items-center space-x-2 mb-6" role="tablist">
<!-- Active Dot (Pill Shape) -->
<span aria-current="step" class="w-6 h-2 bg-brand-red rounded-full transition-all duration-300 shadow-sm"></span>
<!-- Inactive Dot 2 -->
<span class="w-2 h-2 bg-slate-200 rounded-full transition-all duration-300"></span>
<!-- Inactive Dot 3 -->
<span class="w-2 h-2 bg-slate-200 rounded-full transition-all duration-300"></span>
</div>
<!-- Actions Stack -->
<div class="w-full max-w-[340px] space-y-3">
<!-- Primary Action Button: Next -->
<button class="w-full h-[54px] rounded-full bg-gradient-to-r from-brand-red via-[#E62218] to-brand-orange text-white font-bold text-[16px] tracking-wide shadow-cta hover:brightness-105 active:scale-[0.985] transition-all flex items-center justify-center space-x-2 group" type="button">
<span>Next</span>
<svg class="w-4 h-4 transform group-hover:translate-x-0.5 transition-transform" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Secondary Action Link -->
<button class="text-sm font-semibold text-slate-400 hover:text-slate-600 transition-colors py-1.5 focus:outline-none" type="button">
          Skip
        </button>
</div>
<!-- iOS Home Indicator Bar -->
<div aria-hidden="true" class="w-32 h-1 bg-slate-300/80 rounded-full mt-4 -mb-3"></div>
</footer>
<!-- END: BottomContentAndActions -->
</main>
<!-- END: MobileContainer -->
</body></html>
